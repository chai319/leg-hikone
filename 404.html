<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません — LEG彦根</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100svh; display:grid; place-items:center; padding:2rem;
    background:#06211D; color:#EAF6F2; text-align:center;
    font-family:'Plus Jakarta Sans','Noto Sans JP',system-ui,-apple-system,'Hiragino Sans',sans-serif;
    line-height:1.9; letter-spacing:.02em;
    background-image:
      radial-gradient(80% 60% at 20% 10%, rgba(18,165,148,.3) 0%, transparent 60%),
      radial-gradient(70% 55% at 85% 80%, rgba(45,212,167,.2) 0%, transparent 62%);
  }
  .code{font-size:clamp(3.5rem,14vw,6rem); font-weight:800; line-height:1; letter-spacing:-.04em;
    background:linear-gradient(135deg,#12A594,#2DD4A7); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; margin:0 0 1rem}
  h1{font-size:clamp(1.125rem,4vw,1.5rem); color:#fff; margin:0 0 .75rem}
  p{color:#7DE8D0; margin:0 0 2rem; font-size:.9375rem}
  a{
    display:inline-flex; align-items:center; justify-content:center; min-height:56px; padding:0 1.75rem;
    border-radius:999px; background:linear-gradient(135deg,#0E7C6B,#2DD4A7); color:#04201C;
    font-weight:700; text-decoration:none; box-shadow:0 8px 24px rgba(18,165,148,.28);
  }
  a:focus-visible{outline:3px solid #F2B441; outline-offset:3px}
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>ページが見つかりませんでした</h1>
    <p>URLが変わったか、削除された可能性があります。</p>
    <a href="./">LEG彦根のトップへ</a>
  </main>
</body>
</html>
